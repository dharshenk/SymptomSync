services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: symptom-sync-app
    healthcheck:
      disable: true
    env_file:
      - .env
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "8888:8000"
    volumes:
      - ./src:/app/src
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--app-dir", "src", "--reload", "--reload-dir", "src"]
    depends_on:
      - postgres-db
      - redis-db
      - jaeger
    networks:
      - symptom_sync_backend
    restart: unless-stopped

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.22.0
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"
    networks:
      - symptom_sync_backend
    restart: unless-stopped

  postgres-db:
    image: postgres:17.5-alpine3.22
    container_name: postgres-db
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin}
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_DB=mydatabase
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - symptom_sync_backend
    restart: unless-stopped

  redis-db:
    image: redis:8.0.3-alpine
    container_name: redis-db
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-admin}
    volumes:
      - redisdata:/data
    networks:
      - symptom_sync_backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:

networks:
  symptom_sync_backend:
    name: symptom_sync_backend
    driver: bridge
